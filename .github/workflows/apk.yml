# 근무표 2를 안드로이드 APK(gunmu2.apk)로 빌드한다.
# main에 올라가면 Releases(latest)에 gunmu2.apk 를 추가·교체한다.
name: APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'engine.js', 'holidays.js', 'manifest.webmanifest', 'icons/**', 'apk/**', 'test/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['index.html', 'engine.js', 'holidays.js', 'manifest.webmanifest', 'icons/**', 'apk/**', 'test/**', '.github/workflows/apk.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 계산 시험
        run: node test/engine.test.js
      - name: 웹 파일 복사, Capacitor 안드로이드 프로젝트 만들기
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp -r ../index.html ../engine.js ../holidays.js ../manifest.webmanifest ../icons www/
          npx cap add android
          npx cap sync android
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp ../icons/icon-192.png "$d/ic_launcher.png"
            cp ../icons/icon-192.png "$d/ic_launcher_round.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: 서명 키 (같은 키로 서명해야 업데이트 설치가 됨)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - name: APK 빌드
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gunmu2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: gunmu2.apk
      - name: Releases에 올리기 (main에서만)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --latest --title "근무표 2 (안드로이드·Windows)" --notes "앱 파일" || gh release view app >/dev/null
          gh release upload app gunmu2.apk --clobber
